# GRIMA example configuration.
#
# Every setting here has a built-in default, so the binary runs with no config
# file at all. This file documents the surface and is the recommended starting
# point.
#
# GRIMA rejects unknown keys rather than ignoring them, so a typo surfaces at
# startup instead of silently disabling a setting.

[general]
# Directories to watch. Must be absolute paths, and the form depends on the host:
#
#   Windows   monitor_paths = ["C:/Users/you/Documents"]
#   Linux     monitor_paths = ["/home/you", "/srv/data"]
#
# `/home` is not an absolute path on Windows — it resolves against the current
# drive — so the POSIX form below is rejected there with a message saying so.
# Anything outside this list is invisible to the detector.
monitor_paths = ["/home", "/srv"]
log_level = "info"

[bus]
# Bounded queue. An encryption storm is an overload condition, so the bus drops
# by policy and counts every drop instead of growing without limit.
capacity = 8192
drop_policy = "drop_oldest"   # drop_oldest | drop_newest | block

[filewatch]
# Bytes sampled from the head and the tail of a changed file. Sampling rather
# than reading whole files bounds I/O under a storm, and the tail sample also
# catches partial encryption that leaves the middle of a file untouched.
entropy_sample_bytes = 4096
# Re-read recently modified files when the OS notification buffer overflows, so
# a storm that outran the buffer still reaches the fingerprint window.
rescan_on_overflow = true
sample_interval = "2s"
# How long Start may spend registering watches on the initial tree. The rest are
# handed to the background worker and counted as add_pending in /healthz, so a
# large tree under load cannot delay the other sensors or the score loop. "0s"
# means unbounded.
startup_deadline = "10s"

[procwatch]
# How often the process table is sampled. Lower means tighter attribution and
# more CPU.
sample_interval = "1s"

[attribution]
# Where a file event is filed.
#
#   host       make no per-process claim: every event goes to the host
#              fingerprint. Detection works and nothing is blamed wrongly.
#   correlate  blame the largest recent writer. No privileges needed, and wrong
#              whenever another process wrote more bytes in the same window —
#              measured at 0% accuracy on a known-writer workload. Kept because
#              it is the baseline the causal path is compared against, not
#              because it is fit to deploy.
#   audit      take the writer from Windows file-system auditing: an audit ACE on
#              each monitored directory makes the Security log report every write
#              with the process that made it. Needs an elevated process, and was
#              measured at 96.9% with every causal decision correct.
#
# Prefer host over correlate. Blaming a process the detector cannot identify
# fragments cumulative evidence across unrelated processes, so a slow drip stops
# accumulating, and it makes a legitimate burst look like a deviation from
# whichever quiet process happened to be blamed.
#
# A causal mode that cannot start falls back with the reason in the log, so the
# detector keeps running and says why it cannot name the actor.
mode = "host"

# How long a file event waits for the audited record before it is attributed by
# correlation instead. It must exceed the Security log's delivery latency.
max_delay = "500ms"

# Let GRIMA enable the File System audit subcategory and set the audit ACE on
# every monitored directory. Set false to leave host auditing alone and manage
# the policy and the ACEs yourself. Either way the process must be elevated.
audit_setup = true

[decoy]
# Canary files. A legitimate process has no reason to touch a file the user
# never created, which makes this the highest-precision signal available.
#
# Planting writes real files into the directories you monitor. That is a side
# effect on your filesystem, not just on the detector, so it is bounded and it
# is recorded:
enabled = true
names = ["_grima_canary.doc", "quarterly_report_2019.xlsx", "invoices_backup.pdf"]
count_per_dir = 2

# How far below each monitored root decoys are planted. 0 means the monitored
# directories themselves and nothing deeper, which is the default because the
# alternative writes two files into every directory of the tree — on a real home
# directory that is thousands of plausible-looking documents appearing in your
# folders, your version control and your backups.
max_depth = 0

# Every planted path is recorded here, so the run can be undone:
#
#   grima --config <this> --remove-decoys
#
# removes exactly the files this manifest lists, and only while their contents
# are still the canary body — a decoy you replaced with a real document is left
# alone. The manifest is a union across runs, so decoys planted earlier, or
# under a different max_depth, are still removable.
manifest_path = "grima-decoys.json"

[window]
# Decay for the burst track. The cumulative track never decays, which is what
# catches slow drip encryption.
decay_half_life = "30s"
# Length of the event-kind n-gram read from each window. The share of k-grams
# holding a write followed by a rename is signal `ngram_rename_chain`.
ngram_length = 32

[calibration]
# Capture the host baseline with: grima --config <this> --calibrate
warmup = "10m"
min_samples = 200
baseline_path = "grima-baseline.json"
# Floor on the standard deviation of an extension's entropy distribution, so a
# degenerate distribution never divides by zero.
entropy_sigma_floor = 0.05

[scoring]
level_bands = { low = 20, medium = 45, high = 70, critical = 88 }

# Writes per second treated as suspicious when no host baseline exists. It is
# replaced by the calibrated write_burst signal as soon as a baseline is
# available, so this only affects uncalibrated mode.
absolute_write_rate = 20

# The smallest number of events in a window that counts as a burst when the
# host's measured rate for that event kind is zero.
#
# A zero rate is a measurement, not a missing one: a warm-up on a quiet machine
# records zero renames, and a burst signal compared against that zero would
# either divide by zero or be switched off for the life of the deployment —
# leaving the one signal that could see a rename storm permanently dead while
# health still reported the baseline as ready. The floor keeps the signal live
# without letting a single ordinary event saturate it: a host that never renames
# stays silent through an editor's occasional atomic save, and still sees a mass
# rename.
zero_baseline_burst = 25

# Fusion weights. These defaults are a starting point; Phase 6 replaces them
# with values from a grid search over the scenario corpus.
[[scoring.weights]]
name = "entropy_deviation"
weight = 1.0
[[scoring.weights]]
name = "magic_mismatch"
weight = 1.0
[[scoring.weights]]
name = "write_burst"
weight = 1.0
# Creates per second against the host's measured create rate. A process that only
# creates files — an unpacker, a restore, a locker writing a note per directory —
# writes nothing the write counter records, so without this signal a create-only
# storm is invisible. Weighted below write_burst because a create-only burst is
# the weakest of the burst shapes: at 0.6 a saturated burst reaches the medium
# band alone, and the host's own create rate is what keeps a machine that
# unpacks all day quiet.
[[scoring.weights]]
name = "create_burst"
weight = 0.6
[[scoring.weights]]
name = "write_rate_absolute"
weight = 1.0
[[scoring.weights]]
name = "rename_burst"
weight = 0.8
# The fraction of the window's event-kind n-grams that hold a write followed by
# a rename, the sequence an encryptor produces when it writes a file and renames
# it to a new extension. k is window.ngram_length. Weighted low on purpose: an
# extractor or installer that renames a new file into place produces the same
# sequence — the two cycles are rotations of each other — so this corroborates
# the content signals rather than alerting on its own.
[[scoring.weights]]
name = "ngram_rename_chain"
weight = 0.2
[[scoring.weights]]
name = "unknown_extension_activity"
weight = 1.0
[[scoring.weights]]
name = "delete_rate"
weight = 0.4
[[scoring.weights]]
name = "dir_fanout"
weight = 0.4
[[scoring.weights]]
name = "cum_bytes_rewritten"
weight = 0.4
[[scoring.weights]]
name = "bus_drops"
weight = 0.2

[rules]
# Patterns are matched case-insensitively against a process command line.
enabled = true

# Anti-recovery commands. Deleting shadow copies or the recovery catalog is a
# strong pre-encryption indicator.
shadow_commands = [
  "vssadmin delete shadows",
  "wmic shadowcopy delete",
  "wbadmin delete catalog",
  "bcdedit /set recoveryenabled no",
]
eventlog_commands = ["wevtutil cl", "Clear-EventLog"]
usn_commands = ["fsutil usn deletejournal"]

# A terminator acting on one of these names is treated as backup destruction.
terminators = ["taskkill", "pkill", "killall", "Stop-Process", "net stop"]
backup_processes = ["sqlservr", "veeam", "backup exec", "beserver", "postgres", "mysqld", "mongod"]

[response]
# Off by default. Suspending a process on a heuristic score is a
# denial-of-service risk, so it must be opted into and stays gated on critical.
enable_suspend = false
suspend_min_level = "critical"
alert_min_level = "medium"

# Throttle repeat alerts for one incident. An incident is identified by the
# verdict's tree root — the process, or the host — and is cleared when severity
# drops below alert_min_level or when the cooldown elapses. "0s" (the default)
# disables throttling, so every scoring tick over the band logs an alert.
alert_cooldown = "0s"

[web]
enabled = true
listen = "127.0.0.1:8787"
