<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GRIMA</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace;
         background: #14161a; color: #d8dee9; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #7b8794; margin-bottom: 20px; }
  .banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px;
            background: #4a3a10; color: #ffd479; border: 1px solid #7a5c12; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #262a31;
           vertical-align: top; }
  th { color: #7b8794; font-weight: normal; }
  .lvl { padding: 1px 7px; border-radius: 3px; font-size: 12px; }
  .info { background: #262a31; } .low { background: #1f3a2a; color: #7ee2a8; }
  .medium { background: #4a3a10; color: #ffd479; }
  .high { background: #4a2410; color: #ff9f6e; }
  .critical { background: #4d1a1a; color: #ff7b7b; }
  .sig { color: #9aa5b1; font-size: 12px; }
  .count { color: #7b8794; font-size: 12px; margin-left: 6px; }
  details { margin: 3px 0 7px; }
  summary { color: #7b8794; font-size: 12px; cursor: pointer; }
  table.members { margin-top: 4px; }
  table.members th, table.members td { padding: 4px 10px; border-bottom: 1px solid #1d2026; }
  .inherited { opacity: 0.65; }
  .empty { color: #7b8794; padding: 20px 0; }
  footer { margin-top: 24px; color: #7b8794; font-size: 12px; }
</style>
</head>
<body>
  <h1>GRIMA</h1>
  <div class="sub">Adaptive multi-layer ransomware detection &mdash; live process risk</div>

  <div id="banner" class="banner" hidden>
    Uncalibrated mode: no host baseline yet, so deviation signals are inactive.
    Override rules and absolute thresholds still apply.
  </div>

  <table>
    <thead>
      <tr><th>PID</th><th>Process</th><th>Level</th><th>Score</th><th>Evidence</th></tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="5" class="empty">Waiting for verdicts&hellip;</td></tr>
    </tbody>
  </table>

  <footer id="footer">connecting&hellip;</footer>

<script>
const rows = document.getElementById("rows");
const banner = document.getElementById("banner");
const footer = document.getElementById("footer");
const trees = new Map();

function memberRows(members) {
  return members.map(m => {
    const dim = m.own ? "" : " inherited";
    const note = m.own ? "own verdict" : "contributes to the tree aggregate";
    return `<tr>
      <td${dim ? ` class="inherited"` : ""}>${m.pid}</td>
      <td class="sig">&mdash;</td>
      <td><span class="lvl ${m.level}${dim}">${m.level}</span></td>
      <td${dim ? ` class="inherited"` : ""}>${m.score.toFixed(1)}</td>
      <td class="sig">${note}</td>
    </tr>`;
  }).join("");
}

function treeRow(t) {
  const evidence = (t.signals || [])
    .map(s => `${s.name}: ${s.detail}`)
    .join("<br>");
  const members = t.members || [];
  const count = members.length ? `<span class="count">${members.length + 1} procs</span>` : "";
  const head = `<tr>
      <td>${t.root}</td>
      <td>${t.proc_name || "(unattributed)"}${count}</td>
      <td><span class="lvl ${t.level}">${t.level}</span></td>
      <td>${t.score.toFixed(1)}</td>
      <td class="sig">${evidence || "&mdash;"}</td>
    </tr>`;
  if (members.length === 0) return head;  // a lone process renders exactly like a flat row
  return head + `<tr><td colspan="5">
      <details><summary>${members.length} contributing process${members.length === 1 ? "" : "es"}</summary>
        <table class="members"><tbody>${memberRows(members)}</tbody></table>
      </details></td></tr>`;
}

function render() {
  const list = [...trees.values()].sort((a, b) => b.score - a.score);
  if (list.length === 0) return;
  rows.innerHTML = list.map(treeRow).join("");
}

async function refreshHealth() {
  try {
    const h = await (await fetch("/healthz")).json();
    banner.hidden = h.calibration_ready;
    footer.textContent =
      `published ${h.bus_published} · dropped ${h.bus_dropped} · ` +
      `processes ${h.live_processes} · uptime ${Math.round(h.uptime_seconds)}s`;
  } catch (e) {
    footer.textContent = "health unavailable";
  }
}

fetch("/api/trees").then(r => r.json()).then(list => {
  (list || []).forEach(t => trees.set(t.root, t));
  render();
});

const events = new EventSource("/events");
events.onmessage = e => {
  const t = JSON.parse(e.data);
  if (t && t.root !== undefined) {
    trees.set(t.root, t);
    render();
  }
};

refreshHealth();
setInterval(refreshHealth, 5000);
</script>
</body>
</html>
